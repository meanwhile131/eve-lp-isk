<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<title>LP to ISK</title>
		<link rel="icon" type="image/png" href="https://images.evetech.net/types/29247/icon">
		<script src="index.js" type="module"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
table {
	width: 100%;
}
table, th, td {
	border: 1px solid black;
	border-collapse: collapse;
}
		</style>
	</head>
	<body>
		<select id="corp_select"></select>
		<label for="adjusted_price">Adjusted price</label>
		<input type="checkbox" id="adjusted_price" checked />
		<table id="offers_table">
			<thead>
				<tr>
					<th rowspan="2">Icon</th>
					<th rowspan="2">Name</th>
					<th rowspan="2">Quantity</th>
					<th rowspan="2">LP</th>
					<th rowspan="2">ISK</th>
					<th colspan="3">Required items</th>
					<th rowspan="2">ISK/LP</th>
				</tr>
				<tr>
					<th>Icon</th>
					<th>Name</th>
					<th>Count</th>
				</tr>
			</thead>
			<tbody id="offers"></tbody>
		</table>
	</body>
</html>
